
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astro Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container">
        <h1>🚀 Astro Adventure</h1>
        <p class="subtitle">Explore the galaxy. Collect coins. Reach the portal!</p>

        <div class="game-frame">
            <canvas id="gameCanvas" width="800" height="450">
                Your browser does not support HTML canvas.
            </canvas>
        </div>

        <div class="instructions">
            <span><strong>Move:</strong> A/D or ←/→</span>
            <span><strong>Jump:</strong> Space</span>
            <span><strong>Restart:</strong> R</span>
        </div>

        <p class="footer-text">Two levels. One space adventure. 🌌</p>
    </main>

    <script src="game.js"></script>
</body>
</html>
